health_monitor:
  ros__parameters:
    publish_rate_hz: 1.0
    topic_grace_period_sec: 10.0
    node_grace_period_sec: 15.0
    hardware_id: robot_bringup_sensors

    topic_names:
      - /scan
      - /imu/data_raw
      - /imu/orientation
      - /diagnostics
    topic_types:
      - sensor_msgs/msg/LaserScan
      - sensor_msgs/msg/Imu
      - sensor_msgs/msg/Imu
      - diagnostic_msgs/msg/DiagnosticArray
    topic_timeouts_sec:
      - 2.0
      - 2.0
      - 2.0
      - 3.0

    expected_nodes:
      - health_monitor
      - rplidar_node
      - a471_serial_node
      - imu_node
