robot_localization_filter:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    debug: false
    publish_tf: true
    print_diagnostics: false
    use_control: false
    reset_on_time_jump: true
    transform_time_offset: 0.0
    transform_timeout: 0.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Primary pose source: wheel odometry from motor controller telemetry.
    odom0: /odom_raw
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false
    odom0_config: [
      true, true, false,
      false, false, true,
      true, false, false,
      false, false, true,
      false, false, false
    ]

    # Use IMU only for yaw rate stabilization.
    # This avoids acceleration-induced drift in indoor mapping.
    imu0: /imu/data_raw
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
