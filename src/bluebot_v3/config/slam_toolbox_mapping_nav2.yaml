slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # Map quality target for later Nav2 localization/use.
    resolution: 0.05
    min_laser_range: 0.2
    max_laser_range: 8.0
    map_update_interval: 2.0

    # Keep update cadence high enough for tight indoor turns.
    minimum_time_interval: 0.20
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10

    # Slightly larger scan buffers improve loop closure opportunities indoors.
    scan_queue_size: 20
    scan_buffer_size: 8
    scan_buffer_maximum_scan_distance: 8.0
    throttle_scans: 1

    transform_publish_period: 0.02
    transform_timeout: 0.5
    tf_buffer_duration: 180.0
    use_scan_matching: true
    use_scan_barycenter: true

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 10.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
